name: Páginas de vista previa
# Crea o actualiza docs/p/<id>/index.html para cada proyecto (vista previa del link de WhatsApp).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: paginas
jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _fuente-gestor/paginas.py
      - run: |
          git add docs/p
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Páginas de vista previa de proyectos"
          git push
